{% extends "base.html" %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}

<div class="card text-center">
    <h1 class="text-xl font-semibold text-gray-900">Password Changed</h1>
    <p class="mt-1 text-sm text-gray-600">Your password has been reset successfully</p>
    <a href="{% url 'accounts:login' %}" class="mt-6 inline-block text-sm font-medium text-blue-600 hover:text-blue-700">Log in with your new password</a>
</div>

{% endblock %}
