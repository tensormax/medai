{% extends "base.html" %}
{% block title %}Email Sent{% endblock %}
{% block content %}

<div class="card text-center">
    <h1 class="text-xl font-semibold text-gray-900">Check Your Email</h1>
    <p class="mt-1 text-sm text-gray-600">Password reset link sent</p>
    <p class="mt-4 text-sm text-gray-700">
        If an account with that email exists, you will receive a password reset link shortly.
    </p>
    <a href="{% url 'accounts:login' %}" class="mt-6 inline-block text-sm font-medium text-blue-600 hover:text-blue-700">Back to login</a>
</div>

{% endblock %}
