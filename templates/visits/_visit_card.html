<div class="flex items-start justify-between gap-3 border-b border-gray-100 py-3 last:border-b-0">
    <div>
        <p class="text-sm font-medium text-gray-900">{{ visit.started_at|date:"d/m/Y" }}</p>
        <p class="text-xs text-gray-500">{{ visit.started_at|date:"g:i A" }}</p>
        {% if visit.summary %}
        <p class="mt-1 text-xs text-gray-600">{{ visit.summary }}</p>
        {% endif %}
    </div>
    <div class="flex shrink-0 items-center gap-2">
        <span class="badge {% if visit.status == 'open' %}bg-blue-50 text-blue-600{% else %}bg-gray-100 text-gray-500{% endif %}">
            {{ visit.get_status_display }}
        </span>
        <a href="{% url 'visits:visit_detail' pk=visit.pk %}" class="font-medium text-blue-600 hover:text-blue-700">View</a>
    </div>
</div>
